        domain: "https://www.zawya.com"
        data_type: "MENA Corporate Deals, Sovereign Bond Updates, Sector Reports"
        latency: "Real-Time"
        auth_status: "AUTHORIZED_SECONDARY"
      - id: "MUBASHER"
        name: "Mubasher Egypt News & Disclosures"
        domain: "https://www.mubasher.info/countries/eg"
        data_type: "Intraday Disclosures, EGX Market News, Corporate Actions Summary"
        latency: "Near Real-Time"
        auth_status: "AUTHORIZED_SECONDARY"
      - id: "ENTERPRISE"
        name: "Enterprise Press (Enterprise Egypt)"
        domain: "https://enterprise.press"
        data_type: "Daily Macro Intelligence, Capital Markets Briefings, Policy Summaries"
        latency: "Twice Daily (Morning/Evening)"
        auth_status: "AUTHORIZED_SECONDARY"
      - id: "AL_BORSA"
        name: "Al Borsa News (جريدة البورصة المصرية)"
