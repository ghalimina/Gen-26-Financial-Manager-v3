version: "2.0.0-Institutional"
last_updated: "2026-08-30"

tiers:
  tier_1:
    name: "Tier 1: Primary Truth"
    description: "Official statutory authorities, exchange feeds, and direct corporate investor relations"
    reliability_weight: 1.00
    sources:
      - id: "EGX_OFFICIAL"
        name: "Egyptian Stock Exchange (EGX)"
        domain: "https://www.egx.com.eg"
        data_type: "Settlement Prices, Indices, Official Corporate Disclosures, Circuit Breakers"
        latency: "Real-Time / End of Day"
        auth_status: "PRIMARY_STATUTORY"
      - id: "CBE_OFFICIAL"
        name: "Central Bank of Egypt (CBE)"
        domain: "https://www.cbe.org.eg"
        data_type: "Policy Corridor Rates, Interbank FX Spot Rates, Inflation Bulletins, Reserve Numbers"
        latency: "Daily / MPC Meetings"
        auth_status: "PRIMARY_STATUTORY"
      - id: "CAPMAS"
        name: "Central Agency for Public Mobilization and Statistics"
        domain: "https://www.capmas.gov.eg"
        data_type: "Official Headline & Core Consumer Price Index (CPI), Industrial Production"
        latency: "Monthly"
        auth_status: "PRIMARY_STATUTORY"
      - id: "FRA_OFFICIAL"
        name: "Financial Regulatory Authority (FRA)"
        domain: "https://www.fra.gov.eg"
        data_type: "Regulatory Sanctions, Capital Approvals, M&A Filings, Margin Trading Rules"
        latency: "Ad-hoc / Regulatory"
        auth_status: "PRIMARY_STATUTORY"
      - id: "MOF_EGYPT"
        name: "Egyptian Ministry of Finance"
        domain: "https://www.mof.gov.eg"
        data_type: "T-Bill & T-Bond Auction Results, Sovereign Debt Issuances, Fiscal Budget Deficit"
        latency: "Weekly Auctions"
        auth_status: "PRIMARY_STATUTORY"
      - id: "COMPANY_IR"
        name: "Official Corporate Investor Relations Portals"
        domain: "Direct Corporate Portals (e.g. CIB IR, Elsewedy IR, TMG IR)"
        data_type: "Audited Financial Statements (Q1/Q2/Q3/FY), AGM Decisions, Dividend Announcements"
        latency: "Quarterly / Event-Driven"
        auth_status: "PRIMARY_STATUTORY"

