        latency: "Real-Time"
        auth_status: "INSTITUTIONAL_TERMINAL"
      - id: "SP_CAPITAL_IQ"
        name: "S&P Global Market Intelligence (Capital IQ)"
        domain: "https://www.capitaliq.spglobal.com"
        data_type: "Standardized Fundamental Ratios, Global Industry Beta Benchmarks"
        latency: "Daily"
        auth_status: "INSTITUTIONAL_TERMINAL"
      - id: "BLOOMBERG"
        name: "Bloomberg Professional Terminal"
        domain: "https://www.bloomberg.com"
        data_type: "Global Fixed Income Spreads, Sovereign CDS Pricing"
        latency: "Real-Time"
        auth_status: "INSTITUTIONAL_TERMINAL"

timestamp_governance:
  architecture: "3-Timestamp Anti-Leakage Protocol"
  rules:
    - timestamp_1: "event_time (The exact historical moment the real-world economic event occurred)"
    - timestamp_2: "publication_time (The exact moment the document or report was publicly released)"
    - timestamp_3: "effective_time (The earliest moment the quantitative engine had access to the data)"
    - invariant: "effective_time >= publication_time >= event_time"
    - anti_leakage_policy: "Models and backtests are forbidden from using data at query_time < effective_time"
