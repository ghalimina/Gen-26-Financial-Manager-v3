  tier_4:
    name: "Tier 4: Cross-Validation & Technical Feeds"
    description: "Market data aggregation services used for cross-checking and candlestick charting"
    reliability_weight: 0.70
    sources:
      - id: "TRADINGVIEW"
        name: "TradingView Chart Feeds"
        domain: "https://www.tradingview.com"
        data_type: "Real-Time Intraday OHLCV Candlesticks, Multi-Timeframe Technical Indicators"
        latency: "Real-Time WebSockets"
        auth_status: "TECHNICAL_AGGREGATOR"
      - id: "YFINANCE"
        name: "Yahoo Finance API Engine"
        domain: "https://finance.yahoo.com"
        data_type: "Historical Daily Bars, Global Commodity Spot (Gold GC=F, Brent BZ=F), GDRs"
        latency: "15-Minute Delayed / EOD"
        auth_status: "TECHNICAL_AGGREGATOR"
      - id: "INVESTING_COM"
        name: "Investing.com Egypt"
        domain: "https://eg.investing.com"
