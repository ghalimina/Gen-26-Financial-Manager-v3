name: GEN-26 Automated CI Test Battery

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run_tests:
    name: Run Master Institutional Test Battery (67 Core Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libxml2-dev libxslt1-dev zlib1g-dev python3-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Full Unit Test Suite & Forensic Validation
        env:
          FLASK_TESTING: "1"
        run: |
          python -m unittest tests/test_egx_trading_rules_engine.py \
                             tests/test_corporate_actions_engine.py \
                             tests/test_institutional_flow_engine.py \
                             tests/test_dynamic_risk_manager.py \
                             tests/test_market_seasonality_engine.py \
                             tests/test_gdr_arbitrage_engine.py \
                             tests/test_advanced_feature_engineering.py \
                             tests/test_ensemble_decision_engine.py \
                             tests/test_telegram_notification_gateway.py \
                             tests/test_universe_expansion.py \
                             tests/test_statistical_arbitrage_engine.py \
                             tests/test_market_intelligence_scraper.py \
                             tests/test_regime_hmm_engine.py -v
