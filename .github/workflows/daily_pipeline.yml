name: GEN-26 24/7 Autonomous Cloud Pipeline & Incubation Engine

on:
  schedule:
    # 08:00, 10:00, 12:00 UTC = 10:00, 12:00, 14:00 Cairo Time (Sun-Thu during EGX Session)
    - cron: '0 8,10,12 * * 0-4'
    # 12:45 UTC = 14:45 Cairo Time (Post-market official EOD closing settlement)
    - cron: '45 12 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  autonomous_cloud_execution:
    name: Autonomous Cloud Price Sync, Multi-Horizon Engine & Paper Incubation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install yfinance pytz flask scipy pandas numpy requests

      - name: 1. Live Market Price Sync (SSOT Pipeline)
        run: |
          python -c "from core.price_sync_service import PriceSyncService; meta = PriceSyncService.sync_all_prices(); print('Price Sync Result:', meta)"

      - name: 2. Multi-Horizon Factor Forecasting & Stock Ranking Engine
        run: |
          python -c "from core.multi_horizon_engine import MultiHorizonEngine; ranks = MultiHorizonEngine.get_all_multi_horizon_rankings(); print(f'Evaluated {len(ranks)} EGX constituents.')"

      - name: 3. Autonomous Paper Trading Incubation (Day 1 of 30)
        run: |
          python -m core.paper_trading_orchestrator

      - name: 4. Full Master Test Battery Verification
        run: |
          python -m unittest discover -s tests -v

      - name: 5. Autonomous Git Commit & Push (Independent Cloud Persistence)
        if: success()
        run: |
          git config --global user.name 'gen26-cloud-runner[bot]'
          git config --global user.email 'cloud-runner@gen26-platform.internal'
          git add data/ reports/ *.json *.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(cloud): autonomous 24/7 incubation cycle & SSOT update [skip ci]" && git push)
