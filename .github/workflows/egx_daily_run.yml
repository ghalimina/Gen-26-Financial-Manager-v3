name: EGX Daily Autonomous Execution

on:
  schedule:
    # 09:45 AM Cairo Time (UTC+3) -> 06:45 UTC
    - cron: '45 6 * * 0-4'
    # 02:30 PM Cairo Time (UTC+3) -> 11:30 UTC
    - cron: '30 11 * * 0-4'
  
  # Allow manual triggering
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-headless-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libxml2-dev libxslt1-dev zlib1g-dev python3-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Headless Engine (Paper Trading & Snapshots)
        env:
          # ADD ANY REQUIRED SECRETS HERE IN GITHUB REPOSITORY SECRETS
          THNDR_API_KEY: ${{ secrets.THNDR_API_KEY }}
          # YAHOO_FINANCE_API_KEY: ${{ secrets.YAHOO_FINANCE_API_KEY }} 
        run: |
          python headless_runner.py

      - name: Commit and Push Updated Snapshots & Journals
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ gen_*.csv paper_trading_journal.json
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(auto): update daily paper trading journal and snapshots"
            git push
          fi
