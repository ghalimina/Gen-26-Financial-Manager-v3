version: "3.8"

services:
  gen26-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gen26_dashboard
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - TZ=Africa/Cairo
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/scheduler/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
